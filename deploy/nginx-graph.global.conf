# api.graph.global (and graph.global) -> the SQLite-backed w2g API on NEW.
server {
    listen 443 ssl;
    server_name api.graph.global graph.global w2g.graph.global;
    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    ssl_certificate /etc/letsencrypt/live/graph.global/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graph.global/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
}
server { listen 80; server_name api.graph.global graph.global w2g.graph.global; return 301 https://$host$request_uri; }
